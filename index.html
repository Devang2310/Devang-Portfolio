  (posted?'<p class="ok-note" id="rf-posted">Thank you! Your recommendation is now live in the list above.</p>':'')+
  '<form class="form" id="rec-form" novalidate><input id="rf-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">'+
  '<div><label for="rf-name">Your name</label><input id="rf-name" autocomplete="name" maxlength="80"></div>'+
  '<div><label for="rf-email">Your email <small>(kept private)</small></label><input id="rf-email" type="email" autocomplete="email" maxlength="120"></div>'+
  '<div><label for="rf-role">Your role and company <small>(optional)</small></label><input id="rf-role" maxlength="120" placeholder="e.g. IT Manager, Rogers"></div>'+
  '<div><label for="rf-rel">How you worked together</label><select id="rf-rel"><option value="">Choose one</option><option>Manager</option><option>Teammate</option><option>Colleague in another team</option><option>End user he supported</option><option>Vendor or partner</option><option>Other</option></select></div>'+
  '<div class="full"><label for="rf-text">Your recommendation</label><textarea id="rf-text" maxlength="1500" placeholder="His work ethic, how he handled a tough issue, what he was like to work with…"></textarea></div>'+
  '<p class="err full" id="rf-err" hidden></p><div class="full"><button class="btn" type="submit">'+(LIVE_ON?'Post recommendation':'Prepare my recommendation')+'</button></div></form>'+
  '<div class="result" id="rf-result" hidden><h3>Almost done: send it to Devang</h3><p class="note" id="rf-copied"></p>'+
  '<div class="copyline"><span>Send to</span><code id="rf-to">'+OWNER_EMAIL+'</code><button class="btn ghost" type="button" id="rf-copy-to">Copy email</button><button class="btn ghost" type="button" id="rf-copy-msg">Copy message</button><a class="btn ghost" id="rf-mail" href="#">Open email app</a></div>'+
  '<label for="rf-msg">Your message</label><textarea id="rf-msg" readonly></textarea>'+
  '<p class="note">You can also send it as a LinkedIn message. Once Devang confirms it, it will appear in the list above.</p></div></div>';
}
function contactHTML(){
  return '<section id="contact"><div class="sec-head"><div><div class="eyebrow">Contact</div><h2>Get in touch</h2></div><p>Open to IT infrastructure, EUC and systems administration roles in Ontario.</p></div><div class="contact">'+
  '<div><span>Email</span><b>devangcloud23@gmail.com</b></div><div><span>Phone</span><b>(519) 729-6392</b></div><div><span>LinkedIn</span><a href="https://www.linkedin.com/in/devang-patel-tech23" target="_blank" rel="noopener">devang-patel-tech23 ↗</a></div></div></section>'+
  '<footer class="site">Devang Patel · Canada</footer>';
}
function pageHTML(owner){return '<div class="wrap">'+heroHTML()+expHTML()+skillsHTML()+reviewsHTML(owner)+contactHTML()+'</div>';}

function render(){
  var keep={};["rf-name","rf-email","rf-role","rf-rel","rf-text","ow-paste","ow-name","ow-rel","ow-role","ow-company","ow-text"].forEach(function(id){var e=document.getElementById(id);if(e)keep[id]=e.value;});
  document.getElementById("app").innerHTML=pageHTML(isOwner);
  Object.keys(keep).forEach(function(id){var e=document.getElementById(id);if(e)e.value=keep[id];});
  bind();
}

function copy(text,btn,label){
  var done=function(){btn.textContent="Copied";setTimeout(function(){btn.textContent=label;},1600);};
  try{navigator.clipboard.writeText(text).then(done,function(){btn.textContent="Select and copy it";});}catch(e){btn.textContent="Select and copy it";}
}

function bind(){
  var f=document.getElementById("rec-form");
  f.addEventListener("submit",function(ev){
    ev.preventDefault();
    var v=function(id){return document.getElementById(id).value.trim();};
    var name=v("rf-name"),email=v("rf-email"),role=v("rf-role"),rel=v("rf-rel"),text=v("rf-text");
    var err=document.getElementById("rf-err"),miss=[];
    if(!name)miss.push("your name");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))miss.push("a valid email");
    if(!rel)miss.push("how you worked together");
    if(text.length<20)miss.push("a recommendation of at least 20 characters");
    if(miss.length){err.textContent="Please add "+miss.join(", ")+".";err.hidden=false;return;}
    err.hidden=true;
    if(document.getElementById("rf-hp").value)return;
    if(LIVE_ON){postLive({name:name,email:email,role:role||null,relationship:rel,body:text},f.querySelector('button[type="submit"]'),err);return;}
    var today=new Date().toLocaleDateString("en-CA");
    var msg="Recommendation for Devang Patel\nDate: "+today+"\nName: "+name+"\nEmail: "+email+"\nRole / company: "+(role||"-")+"\nHow we worked together: "+rel+"\nRecommendation:\n"+text;
    document.getElementById("rf-msg").value=msg;
    var mail=document.getElementById("rf-mail");
    mail.href="mailto:"+OWNER_EMAIL+"?subject="+encodeURIComponent("Recommendation for Devang Patel from "+name)+"&body="+encodeURIComponent(msg);
    var note=document.getElementById("rf-copied");
    note.textContent="Email the message below to Devang so he can confirm it and add it to this page.";
    try{navigator.clipboard.writeText(msg).then(function(){note.textContent="Your message is copied. Paste it into an email to Devang so he can confirm it and add it to this page.";},function(){});}catch(e){}
    var r=document.getElementById("rf-result");r.hidden=false;r.scrollIntoView({behavior:"smooth",block:"nearest"});
  });
  document.getElementById("rf-copy-to").addEventListener("click",function(){copy(OWNER_EMAIL,this,"Copy email");});
  document.getElementById("rf-copy-msg").addEventListener("click",function(){var t=document.getElementById("rf-msg");t.select();copy(t.value,this,"Copy message");});
}

render();
loadLive();
})();
</script>
</body>
</html>
